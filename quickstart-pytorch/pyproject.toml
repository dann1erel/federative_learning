[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quickstart-pytorch"
version = "1.1.6"
description = "Federated Learning with PyTorch and Flower (Quickstart Example)"
license = {file = "LICENSE"}
dependencies = [
    "datasets>=3.1.0",
    "flwr[simulation]>=1.28.0",
    "flwr-datasets[vision]>=0.6.0",
    "kagglehub>=0.3.12",
    "matplotlib>=3.8.0",
    "pillow>=10.0.0",
    "tomli>=2.0.1; python_version < '3.11'",
    "torch==2.10.0",
    "torchvision==0.25.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "flwrlabs"
fab-format-version = 1
flwr-version-target = "1.31.0"

[tool.flwr.app.components]
serverapp = "pytorchexample.server_app:app"
clientapp = "pytorchexample.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 3
fraction-evaluate = 1.0
local-epochs = 1
learning-rate = 0.1
local-momentum = 0.9
batch-size = 32
save-model = false
experiment-dir = ""
dataset = "cifar10"
dataset-root = "data/ham10000"
partitioner = "dirichlet"
dirichlet-alpha = 0.5
dirichlet-min-partition-size = 50
validation-ratio = 0.2
seed = 42
class-weighting = "none"
strategy = "fedavg"
proximal-mu = 0.01
server-learning-rate = 1.0
server-momentum = 0.9
fedopt-eta = 0.1
fedopt-beta-1 = 0.9
fedopt-beta-2 = 0.99
fedopt-tau = 0.001
